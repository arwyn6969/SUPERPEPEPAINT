name: Deploy PEPEPAINT

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the selected main commit or roll back to an existing release
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback
      rollback_release_id:
        description: Exact validated release ID (rollback only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pepepaint-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy or roll back application
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pepepaint.journeypaint.fun

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate frontend JavaScript
        run: |
          node --check main.js
          node --check submission-retry.js
          node --check filters.js
          node --check traits.js

      - name: Run frontend tests
        run: npm test

      - name: Validate deployment programs
        run: |
          node --check deployment/build-release.mjs
          bash -n deployment/remote-release.sh
          bash -n deployment/migrate-to-versioned-releases.sh
          bash -n deployment/pepepaint-validate-release
          bash deployment/test/release-scripts.test.sh
          node deployment/test/workflow-safety.test.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev

      - name: Derive and validate immutable release metadata
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        id: release
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          release_id="${COMMIT_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          case "$release_id" in
            *[!0-9a-f-]*|'') exit 1 ;;
          esac
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf 'built_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build immutable release payload
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          BUILT_AT: ${{ steps.release.outputs.built_at }}
        run: |
          node deployment/build-release.mjs \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pepepaint-release" \
            "$RELEASE_ID" "$GITHUB_SHA" "$BUILT_AT"

      # Production credentials are configured only after every repository test,
      # audit, script test, and payload construction step has succeeded.
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.PEPEPAINT_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/pepepaint_deploy
          chmod 600 ~/.ssh/pepepaint_deploy
          printf '%s\n' \
            '87.106.69.245 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPSABAe5Dc1z0tInU5n26EjgbuYd2xGGFxxMsWIqo71v' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload, publish, activate, and verify release
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -eu
          remote() {
            ssh -i ~/.ssh/pepepaint_deploy -o IdentitiesOnly=yes "$@"
          }
          expected_current=$(remote pepepaint-deploy@87.106.69.245 \
            'bash -s -- current-id /var/www/pepepaint' < deployment/remote-release.sh)
          staging_path=$(remote pepepaint-deploy@87.106.69.245 \
            "bash -s -- init /var/www/pepepaint '$RELEASE_ID'" < deployment/remote-release.sh)
          case "$staging_path" in
            /var/www/pepepaint/releases/.staging-"$RELEASE_ID") ;;
            *) echo 'Remote staging path was not the exact expected path.' >&2; exit 1 ;;
          esac
          rsync -az --delete \
            -e 'ssh -i ~/.ssh/pepepaint_deploy -o IdentitiesOnly=yes' \
            "$RUNNER_TEMP/pepepaint-release/" \
            "pepepaint-deploy@87.106.69.245:$staging_path/"
          remote pepepaint-deploy@87.106.69.245 \
            "bash -s -- deploy /var/www/pepepaint '$RELEASE_ID' '$expected_current'" \
            < deployment/remote-release.sh

      - name: Roll back to an existing validated release
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
        env:
          TARGET_RELEASE_ID: ${{ inputs.rollback_release_id }}
        run: |
          set -eu
          if [[ ! "$TARGET_RELEASE_ID" =~ ^[0-9a-f]{40}-[1-9][0-9]{0,19}-[1-9][0-9]{0,5}$ ]]; then
            echo 'Rollback release ID is malformed.' >&2
            exit 1
          fi
          ssh -i ~/.ssh/pepepaint_deploy -o IdentitiesOnly=yes \
            pepepaint-deploy@87.106.69.245 \
            "bash -s -- rollback /var/www/pepepaint '$TARGET_RELEASE_ID'" \
            < deployment/remote-release.sh
