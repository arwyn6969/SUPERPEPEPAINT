<!doctype html>
<!-- SUPERPEPEPAINT seed lab - dev harness only, NOT part of the published zip.
     Serve the project root (python3 -m http.server 8000) and open /dev.html.
     Uses Math.random for seed picking; the app itself never does. -->
<html>
	<head>
		<meta charset="utf-8" />
		<title>SUPERPEPEPAINT seed lab</title>
		<style>
			body { font-family: monospace; background: #f4fff4; color: green; margin: 16px; }
			h1 { font-size: 16px; }
			.controls { margin-bottom: 12px; }
			.grid { display: flex; flex-wrap: wrap; gap: 12px; }
			.cell { border: 1px solid green; background: #fff; }
			.cell iframe { width: 400px; height: 560px; border: 0; display: block; }
			.cell .bar { display: flex; justify-content: space-between; padding: 4px 6px; font-size: 11px; }
			button { font-family: monospace; }
			label { font-size: 12px; }
		</style>
	</head>
	<body>
		<h1>SUPERPEPEPAINT seed lab</h1>
		<div class="controls">
			<button id="reroll">REROLL ALL SEEDS</button>
			<label><input type="checkbox" id="capture" /> capture mode (c=true)</label>
		</div>
		<div class="grid" id="grid"></div>
		<script>
			const N = 6;
			const grid = document.getElementById("grid");
			const capture = document.getElementById("capture");
			function seed() {
				let s = "";
				for (let i = 0; i < 64; i++) s += Math.floor(Math.random() * 16).toString(16);
				return s;
			}
			function build() {
				grid.innerHTML = "";
				for (let i = 0; i < N; i++) {
					const s = seed();
					const cell = document.createElement("div");
					cell.className = "cell";
					const src = "index.html?s=" + s + "&i=" + (i + 1) + (capture.checked ? "&c=true" : "");
					cell.innerHTML =
						'<div class="bar"><span>' + s.slice(0, 12) + "...</span><a href=\"" + src + '" target="_blank">open</a></div>' +
						'<iframe src="' + src + '"></iframe>';
					grid.appendChild(cell);
				}
			}
			document.getElementById("reroll").addEventListener("click", build);
			capture.addEventListener("change", build);
			build();
		</script>
	</body>
</html>
